{{- $releaseName := .Release.Name -}}
{{- $chartName := include "overseer.name" . -}}
{{- $cloudProviderFlavor := include "overseer.cloudProviderFlavor" . -}}
{{- $serviceName := include "service.fullname" . -}}
{{- $server := .Values.server -}}

{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    app: {{ $chartName }}
    component: {{ $chartName }}
    environment: {{ include "overseer.environment" . }}
    release: {{ $releaseName }}
    {{- include "overseer.labels" . | nindent 4 }}
spec:
  {{- if eq $cloudProviderFlavor "minikube" }}
  type: NodePort
  {{- end }}
  ports:
    - port: {{ $server.port }}
      targetPort: {{ $server.targetPort }}
      protocol: {{ $server.protocol }}
      name: http
      {{- if eq $cloudProviderFlavor "minikube" }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
  selector:
    app: {{ $chartName }}
    release: {{ $releaseName }}
    run: {{ $releaseName }}-{{ $chartName }}
    {{- include "overseer.selectorLabels" . | nindent 4 }}
{{- end }}
